services:
  - type: web
    name: 123123-radar
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/beezilonka-bot/123123
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: 123123-radar-db
          property: connectionString

databases:
  - name: 123123-radar-db
    plan: free
    region: oregon
    postgresMajorVersion: 18
